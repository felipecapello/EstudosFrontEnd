<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Canelinha instagram</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <div class="cotainer_total">
        <div class="publi_container">
            <div class="logo_header">
                <img src="Images/instagram.png" alt="logo_insta" id="logo_insta" class="logo_insta">
            </div>
            <div class="apresentacao_text">
                <span class="comeco">Veja momentos do dia a dia do seu animal favorito,  <span class="fim"> Canelinha!</span></span>
            </div>
            <div class="apresentacao_img">
                <img src="Images/canelaPost.jpg" alt="post_exemplo" class="post_exemplo">
            </div>
        </div>
        <div class="container_login">
            <div class="box_login">
                <div class="conteudo_login">
                    <div class="options">
                        <i class="fa-solid fa-gear" ></i>
                    </div>
                    <div class="div_foto_perfil">
                        <img src="Images/ana.jpeg" alt="foto_login" class="foto_login_img">
                    </div>
                    <div class="div_nome_perfil">
                        <span class="nome_login">contrarioana</span>
                    </div>
                    <div class="div_botao_continuar">
                        <input type="submit" class="botao_continuar" value="Continuar">
                    </div>
                    <div class="div_botao_outro_perfil">
                        <input type="submit" class="botao_outro_perfil" value="Usar outro perfil">
                    </div>
                    <div class="div_botao_criar_conta">
                        <input type="submit" class="botao_conta_nova" value="Criar nova conta">
                    </div>
                    <div class="div_icone_meta">
                        <img src="Images/meta (2).png" alt="icone_meta" class="icone_meta">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <footer class="footer">
        <div class="botoes_ajuda">
            <span class="botao_footer">Meta</span>
            <span class="botao_footer">Sobre</span>
            <span class="botao_footer">Blog</span>
            <span class="botao_footer">Carreiras</span>
            <span class="botao_footer">Ajuda</span>
            <span class="botao_footer">API</span>
            <span class="botao_footer">Privacidade</span>
            <span class="botao_footer">Termos</span>
            <span class="botao_footer">Localizações</span>
            <span class="botao_footer">Popular</span>
            <span class="botao_footer">Instagram Lite</span>
            <span class="botao_footer">Meta AI</span>
            <span class="botao_footer">Muse</span>
            <span class="botao_footer">Threads</span>
            <span class="botao_footer">Upload de contatos e não usuários</span>
            <span class="botao_footer"> Meta Verfied</span>
        </div>
        <div class="direitos_idiomas">
            <select name="idioma" id="idioma" class="idiomas">
                <option value="PT-BR">Português do Brasil</option>
                <option value="ESP">Espanhol</option>
                <option value="ING">Inglês</option>
            </select>
            <span class="direitos">© 2026 Instagram from Meta</span>
        </div>
    </footer>
</body>

</html>
